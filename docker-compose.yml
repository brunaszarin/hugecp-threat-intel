services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hugecp
      POSTGRES_PASSWORD: hugecp
      POSTGRES_DB: hugecp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hugecp -d hugecp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
